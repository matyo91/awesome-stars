name: update awesome-stars

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: write

concurrency:
  group: awesome-stars-update
  cancel-in-progress: false

jobs:
  awesome-stars:
    name: update awesome-stars
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install starred
        run: |
          python -m pip install --disable-pip-version-check "starred==4.3.0"

      - name: Resolve repository name
        run: echo "REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - name: Update categories by language
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ env.REPOSITORY_NAME }}
          USERNAME: ${{ github.repository_owner }}
        run: >-
          starred --username "$USERNAME" --repository "$REPOSITORY" --sort
          --token "$GITHUB_TOKEN"
          --message "awesome-stars category by language update by github actions cron, created by starred"

      - name: Update categories by topic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ env.REPOSITORY_NAME }}
          USERNAME: ${{ github.repository_owner }}
        run: >-
          starred --username "$USERNAME" --repository "$REPOSITORY" --sort
          --token "$GITHUB_TOKEN"
          --message "awesome-stars category by topic update by github actions cron, created by starred"
          --topic --topic_limit 500 --filename topics.md
